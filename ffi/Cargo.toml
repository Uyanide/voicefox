[package]
name = "voicefox-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
flutter_rust_bridge = "=2.13.0"
serde.workspace = true
voicefox-application = { package = "voicefox-application", path = "../application" }
voicefox-runtime = { path = "../runtime" }
lx-core = { path = "../core" }

[features]
default = ["desktop-mpv"]
desktop-mpv = ["voicefox-runtime/desktop-mpv"]
