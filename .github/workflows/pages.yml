name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
    paths: ["site/**", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # 版本徽标不再手改：发布提交会 bump Cargo.toml，这里在部署前注入工作区版本。
      # Cargo.toml 也在 paths 里，所以只改版本的发布提交同样会触发这次部署。
      - name: Inject version badge
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "site version: $version"
          sed -i -E "s#v[0-9]+\.[0-9]+\.[0-9]+#v${version}#g" site/index.html
          found=$(grep -oE "v[0-9]+\.[0-9]+\.[0-9]+" site/index.html | sort -u | tr "\n" " ")
          echo "badge versions on page: $found"
          [ "$found" = "v${version} " ] || { echo "版本徽标注入失败：期望 v${version}，页面为 $found"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
