name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux 构建 ──
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: voicefox-linux-x86_64
          path: target/release/voicefox
          if-no-files-found: error
          retention-days: 1

  # ── Windows 构建 ──
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Install MinGW and libmpv
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu

          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Files live directly under /libmpv/ (no mpv-dev/ subdirectory);
          # resolve the latest mpv-dev-x86_64 build from the SourceForge RSS.
          $rssUrl = "https://sourceforge.net/projects/mpv-player-windows/rss?path=/libmpv"
          $fallbackUrl = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20260809-git-dd5d17d328.7z"

          $libmpvUrl = $null
          try {
            [xml]$rss = (Invoke-WebRequest -Uri $rssUrl -UseBasicParsing).Content
            $libmpvUrl = $rss.rss.channel.item.link |
              Where-Object { $_ -match "/files/libmpv/mpv-dev-x86_64-[^/]+\.7z/download" -and $_ -notmatch "-v3-" } |
              Select-Object -First 1
          }
          catch {
            Write-Warning "Resolving latest libmpv from RSS failed: $_"
          }

          if (-not $libmpvUrl) {
            Write-Warning "Falling back to pinned libmpv URL"
            $libmpvUrl = $fallbackUrl
          }

          Write-Host "Downloading libmpv from $libmpvUrl"

          curl.exe --location --fail --retry 3 --retry-delay 2 `
            --output mpv-dev.7z $libmpvUrl

          if ($LASTEXITCODE -ne 0) {
            throw "Downloading libmpv failed with exit code $LASTEXITCODE"
          }

          if ((Get-Item mpv-dev.7z).Length -lt 1MB) {
            throw "Downloaded libmpv archive is unexpectedly small"
          }

          7z t mpv-dev.7z | Out-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Downloaded libmpv archive is invalid"
          }

          New-Item -ItemType Directory -Force -Path mpv-source/64 | Out-Null

          7z x mpv-dev.7z "-ompv-source/64" | Out-Host

          if ($LASTEXITCODE -ne 0) {
            throw "Extracting libmpv failed with exit code $LASTEXITCODE"
          }

          "MPV_SOURCE=$((Get-Location).Path)\mpv-source" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target x86_64-pc-windows-gnu
          --features lx-player/build_libmpv

      - name: Validate and package binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            target/x86_64-pc-windows-gnu/release/voicefox.exe `
            dist/voicefox.exe

          Copy-Item `
            mpv-source/64/libmpv-2.dll `
            dist/libmpv-2.dll

          Push-Location dist

          try {
            $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue

            if ($null -eq $objdump) {
              $objdumpPath = @(
                "C:\msys64\mingw64\bin\objdump.exe",
                "C:\msys64\usr\bin\objdump.exe"
              ) |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              if ($null -ne $objdumpPath) {
                $objdump = Get-Item $objdumpPath
              }
            }

            if ($null -eq $objdump) {
              Write-Warning "objdump.exe was not found; skipping import-table diagnostics"
            }
            else {
              $imports = (& $objdump.Path -p voicefox.exe | Out-String)

              $imports |
                Select-String "DLL Name:|mpv_client_api_version"

              if ($imports -notmatch "DLL Name:\s+libmpv-2\.dll") {
                throw "voicefox.exe does not import the bundled libmpv-2.dll"
              }

              if ($imports -notmatch "mpv_client_api_version") {
                throw "voicefox.exe does not import mpv_client_api_version"
              }
            }

            .\voicefox.exe --check-libmpv

            if ($LASTEXITCODE -ne 0) {
              throw "Bundled libmpv runtime check failed with exit code $LASTEXITCODE"
            }

            7z a voicefox-windows-x86_64.zip `
              voicefox.exe `
              libmpv-2.dll | Out-Host

            if ($LASTEXITCODE -ne 0) {
              throw "Packaging Windows artifact failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voicefox-windows-x86_64
          path: dist/voicefox-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 1

  # ── macOS 构建 ──
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            runner_arch: x86_64
            target: x86_64-apple-darwin
            artifact: voicefox-macos-x86_64

          - arch: arm64
            runner: macos-15
            runner_arch: arm64
            target: aarch64-apple-darwin
            artifact: voicefox-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install mpv
          echo "RUSTFLAGS=-Lnative=$(brew --prefix mpv)/lib" >> "$GITHUB_ENV"

      - name: Build
        run: >
          cargo build
          --locked
          --release
          --package voicefox-app
          --target "${{ matrix.target }}"
          --verbose

      - name: Inspect libmpv linkage
        run: |
          mpv_lib="$(brew --prefix mpv)/lib/libmpv.dylib"
          binary="target/${{ matrix.target }}/release/voicefox"

          file "$mpv_lib"
          file "$binary"

          file "$binary" | grep -q "${{ matrix.runner_arch }}"

          otool -L "$binary"

      - name: Validate libmpv runtime
        run: |
          target/${{ matrix.target }}/release/voicefox --check-libmpv

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/voicefox
          if-no-files-found: error
          retention-days: 1
