name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux 构建 ──
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: voicefox-linux-x86_64
          path: target/release/voicefox

  # ── Windows 构建（使用 Windows 原生 runner） ──
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Install MinGW and libmpv
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          "C:\msys64\mingw64\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Invoke-WebRequest `
            -Uri "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z" `
            -OutFile mpv-dev.7z
          New-Item -ItemType Directory -Force -Path mpv-source/64 | Out-Null
          7z x mpv-dev.7z "-ompv-source/64" | Out-Host
          "MPV_SOURCE=$((Get-Location).Path)\mpv-source" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu --features lx-player/build_libmpv 2>&1

      - name: Package binary and libmpv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/voicefox.exe dist/voicefox.exe
          Copy-Item mpv-source/64/libmpv-2.dll dist/libmpv-2.dll
          7z a dist/voicefox-windows-x86_64.zip dist/voicefox.exe dist/libmpv-2.dll | Out-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicefox-windows-x86_64
          path: dist/voicefox-windows-x86_64.zip

  # ── macOS 构建 ──
  build-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install mpv

      - name: Build
        run: cargo build --release --verbose

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: voicefox-macos-x86_64
          path: target/release/voicefox
